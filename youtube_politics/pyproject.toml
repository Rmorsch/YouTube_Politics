[project]
name = "youtube_politics"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.24",
    "dagster-dbt>=0.29.24",
    "dagster-snowflake>=0.29.24",
    "dbt-snowflake>=1.12.1",
    "google-api-python-client>=2.200.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "youtube_politics"
registry_modules = [
    "youtube_politics.components.*",
]


