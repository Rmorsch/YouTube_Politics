# The fixed list of YouTube channels this project tracks.
#
# Edit by hand. Each entry needs a `handle` (the @name shown on the channel's
# page, e.g. youtube.com/@CNN). Any other keys you add are free-form: they're
# stored alongside the API data as CATALOG_ENTRY, so dbt can use them later
# without Dagster needing to know what they mean.
#
# Keys used below (all optional, change them however you like):
#   group:  study   = political YouTubers/streamers being analysed
#           control = news outlets, the baseline to compare against
#   type:   streamer    = live-streams as a main format (VOD playlists matter here)
#           commentator = personality-led show/channel, mostly pre-recorded
#           network     = news organisation
#   org:    the outlet/network a personality belongs to, if any
#   lean:   a rough, conventional label for grouping in analysis:
#           left / right / mixed (both sides or heterodox) / center / neutral.
#           Subjective; adjust to whatever definition your analysis uses.
#
# Before materializing after adding/changing handles, check them with
#     uv run python .dev/ping_channels.py
# (1 quota unit per handle, writes nothing). If a handle is wrong anyway,
# yt_catalog_initial fails and names it before writing anything.
#
# After editing, re-materialize the yt_catalog_initial asset to load the changes.

channels:
